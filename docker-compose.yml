services:
  backend:
    build: ./backend
    ports:
      - "8000:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      # NEXT_PUBLIC_API_URL is embedded at build time — points to where
      # the browser will reach the backend (host-accessible URL)
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
